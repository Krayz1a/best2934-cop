[project]
name = "p2pchase-cop"
version = "1.0.0"
description = "best2934 — Cop agent for the distributed Cops-and-Robbers P2P race (UOH, Orchestration of AI Agents 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
p2pchase = "p2pchase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2pchase"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
