[project]
name = "p2pchase-cop"
version = "1.0.0"
description = "best2934 — Cop agent for the distributed Cops-and-Robbers P2P race (UOH, Orchestration of AI Agents 2026)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Tomer Levy" },
    { name = "Eyal Koloshi" },
    { name = "Alon Issman" },
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
]
llm = ["anthropic>=0.40"]
analysis = ["matplotlib>=3.8", "numpy>=1.26", "jupyter>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
p2pchase = "p2pchase.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2pchase"]

# --- Linting -----------------------------------------------------------------
# Guidelines §7.1: zero Ruff violations. E501 is ignored per the guideline's own
# sample configuration -- the line-length ceiling is a formatting target, not a
# hard failure, and book citations carry long URLs that would wrap unreadably.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# --- Testing -----------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src/p2pchase --cov-report=term-missing --cov-report=html:results/coverage"
markers = [
    "integration: end-to-end tests that run a full sub-game",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/p2pchase/cli/main.py",
    "*/tests/*",
    "src/p2pchase/ui/gui/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
